<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      /*
        The page frames the game at a fixed 9:16 and fills the rest with the wall colour of the
        room the art draws (`docs/art-direction.md` §2.2, §3.1). At exactly the reference aspect
        the CanvasScaler yields 1080 x 1920 canvas units on every monitor, so the composition -
        and the hardcoded HUD margins that depend on it - are identical everywhere.
      */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #F3E7D6;
      }

      #unity-container {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #unity-canvas {
        display: block;
        background: #F3E7D6;
        /* Sized in script: the CSS box is the letterbox, the backing store is capped. */
      }

      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 40%;
        max-width: 320px;
        display: none;
      }

      #unity-progress-bar-empty {
        width: 100%;
        height: 14px;
        border-radius: 7px;
        background: #E3D2BC;
        overflow: hidden;
      }

      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        border-radius: 7px;
        background: #C98B5E;
        transition: width 0.1s linear;
      }

      #unity-warning {
        position: absolute;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        font-family: system-ui, sans-serif;
        font-size: 14px;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      // Frame of the game on the page (§13 GDD, art-direction §3.1).
      var ASPECT_W = 9;
      var ASPECT_H = 16;
      // Ceiling of the drawing buffer. Above it the UI and the sprites are upscaled anyway, and
      // pixels cost quadratically at webGLMemorySize: 32.
      var MAX_BUFFER_WIDTH = 1080;
      var MAX_BUFFER_HEIGHT = 1920;
      // Retina is worth paying for once; beyond 2x the cost buys nothing visible here.
      var MAX_PIXEL_RATIO = 2;

      var canvas = document.querySelector("#unity-canvas");
      var densityQuery = null;

      function layout() {
        var cssWidth = Math.min(
          window.innerWidth,
          window.innerHeight * ASPECT_W / ASPECT_H);
        var cssHeight = cssWidth * ASPECT_H / ASPECT_W;

        canvas.style.width = cssWidth + "px";
        canvas.style.height = cssHeight + "px";

        var ratio = Math.min(window.devicePixelRatio || 1, MAX_PIXEL_RATIO);
        // The height follows from the width, so the buffer keeps the exact frame aspect and one
        // ceiling check covers both axes.
        var bufferWidth = Math.min(Math.round(cssWidth * ratio), MAX_BUFFER_WIDTH);
        var bufferHeight = Math.min(
          Math.round(bufferWidth * ASPECT_H / ASPECT_W),
          MAX_BUFFER_HEIGHT);

        if (canvas.width !== bufferWidth || canvas.height !== bufferHeight) {
          canvas.width = bufferWidth;
          canvas.height = bufferHeight;
        }
      }

      // devicePixelRatio does not fire resize on its own: dragging the window to a monitor of a
      // different density changes it silently. A media query on the current value does fire.
      function watchPixelRatio() {
        if (densityQuery && densityQuery.removeEventListener) {
          densityQuery.removeEventListener("change", onPixelRatioChanged);
        }

        densityQuery = window.matchMedia(
          "(resolution: " + (window.devicePixelRatio || 1) + "dppx)");
        if (densityQuery.addEventListener) {
          densityQuery.addEventListener("change", onPixelRatioChanged);
        }
      }

      function onPixelRatioChanged() {
        layout();
        watchPixelRatio();
      }

      // Shows a temporary message banner, or a permanent error message on top of the canvas.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

      // The page owns the backing store: the engine must not resize it back to the DOM size times
      // devicePixelRatio, or the ceiling above is meaningless on a dense display.
      config.matchWebGLToCanvasSize = false;

      layout();
      watchPixelRatio();
      window.addEventListener("resize", layout);

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then(() => {
          document.querySelector("#unity-loading-bar").style.display = "none";
        }).catch((message) => {
          unityShowBanner(message, 'error');
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
